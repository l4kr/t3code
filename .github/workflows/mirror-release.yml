name: Release

on:
  schedule:
    - cron: "41 * * * *"
  push:
    branches: [main]
    paths: [fork/**, .github/workflows/mirror-release.yml]
  workflow_dispatch:
    inputs:
      replace:
        description: Release the latest upstream version again, replacing this fork's release of it
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: mirror-release
  cancel-in-progress: false

env:
  UPSTREAM: pingdotgg/t3code

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      skip: ${{ steps.pick.outputs.skip }}
      replace: ${{ steps.pick.outputs.replace }}
    steps:
      - name: Keep schedule alive
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/mirror-release.yml/enable" || true

      - name: Pick release
        id: pick
        env:
          REPLACE: ${{ inputs.replace }}
        run: |
          tag="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$REPLACE" = "true" ]; then
              echo "replace=true" >> "$GITHUB_OUTPUT"
            else
              echo "$tag is already released."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: pick
    if: needs.pick.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.pick.outputs.tag }}
      VERSION: ${{ needs.pick.outputs.version }}
      UPSTREAM_REF: refs/tags/${{ needs.pick.outputs.tag }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Merge the release into main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash fork/sync.sh merge

      - name: Read upstream build config
        run: |
          gh release download "$TAG" --repo "$UPSTREAM" --pattern "T3-Code-$VERSION-arm64.zip" --dir "$RUNNER_TEMP/upstream"
          zip="$RUNNER_TEMP/upstream/T3-Code-$VERSION-arm64.zip"
          entry="$(unzip -Z1 "$zip" | grep -m1 'Contents/Resources/app\.asar$')"
          unzip -p "$zip" "$entry" > "$RUNNER_TEMP/app.asar"
          node fork/upstream-client-env.mjs --asar "$RUNNER_TEMP/app.asar" --work "$RUNNER_TEMP" > "$RUNNER_TEMP/client.env"
          cat "$RUNNER_TEMP/client.env" >> "$GITHUB_ENV"
          grep '^VITE_CLERK_PUBLISHABLE_KEY=' "$RUNNER_TEMP/client.env" | sed 's/^VITE_/T3CODE_/' >> "$GITHUB_ENV"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Verify, build, and refuse to ship telemetry
        run: bash fork/sync.sh verify

      - name: Push main
        id: push
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ] && ! git push origin HEAD:main; then
            echo "::error::Push refused. Upstream commits that touch workflows need a FORK_SYNC_TOKEN secret: a fine-grained token for this repository with Contents and Workflows read/write."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log --oneline -1

      - uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: |
            apps/server/dist
            !apps/server/dist/**/*.map
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: |
            apps/desktop/dist-electron
            !apps/desktop/dist-electron/**/*.map
          if-no-files-found: error
          retention-days: 1

  cli:
    needs: [pick, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux, arch: x64, key: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64, key: linux-arm64 }
          - { runner: macos-latest, platform: mac, arch: arm64, key: darwin-arm64 }
          - { runner: windows-latest, platform: win, arch: x64, key: win32-x64 }
          - { runner: windows-11-arm, platform: win, arch: arm64, key: win32-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.pick.outputs.version }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: apps/server/dist

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/scripts...

      - name: Put Vite+ on the Windows PATH
        if: matrix.platform == 'win'
        run: cygpath -w "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build resource monitor
        run: |
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "$RUNNER_TEMP/resource-monitor/${{ matrix.key }}"
          cp native/resource-monitor/target/release/t3-resource-monitor* "$RUNNER_TEMP/resource-monitor/${{ matrix.key }}/"
          rm -f "$RUNNER_TEMP/resource-monitor/${{ matrix.key }}/"*.d "$RUNNER_TEMP/resource-monitor/${{ matrix.key }}/"*.pdb

      - name: Install patchelf
        if: matrix.platform == 'linux'
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Build CLI archive
        run: |
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" \
            --version "$VERSION" --resource-monitor-dir "$RUNNER_TEMP/resource-monitor" --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ matrix.key }}
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: [pick, build]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      SEVEN_ZIP: C:/Program Files/7-Zip/7z.exe
      TAG: ${{ needs.pick.outputs.tag }}
      VERSION: ${{ needs.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ${{ runner.temp }}/server-dist

      - uses: actions/download-artifact@v4
        with:
          name: desktop-dist
          path: ${{ runner.temp }}/desktop-dist

      - name: Download upstream installer
        run: >
          gh release download "$TAG" --repo "$UPSTREAM"
          --pattern "T3-Code-$VERSION-x64.exe" --dir "$RUNNER_TEMP/upstream"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repack
        run: >
          node fork/repack-windows.mjs
          --installer "$RUNNER_TEMP/upstream/T3-Code-$VERSION-x64.exe"
          --tag "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --server-dist "$RUNNER_TEMP/server-dist"
          --desktop-dist "$RUNNER_TEMP/desktop-dist"
          --out "$RUNNER_TEMP/out"
          --work "$RUNNER_TEMP/work"
          --7z "$SEVEN_ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            ${{ runner.temp }}/out/T3-Code-${{ env.VERSION }}-x64.exe
            ${{ runner.temp }}/out/T3-Code-${{ env.VERSION }}-x64.exe.blockmap
            ${{ runner.temp }}/out/latest.yml
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: [pick, build]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.pick.outputs.tag }}
      VERSION: ${{ needs.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ${{ runner.temp }}/server-dist

      - uses: actions/download-artifact@v4
        with:
          name: desktop-dist
          path: ${{ runner.temp }}/desktop-dist

      - name: Download upstream app
        run: >
          gh release download "$TAG" --repo "$UPSTREAM"
          --pattern "T3-Code-$VERSION-${{ matrix.arch }}.zip" --dir "$RUNNER_TEMP/upstream"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import signing certificate
        id: cert
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -sSLf -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then echo "::error::No Developer ID Application identity in the certificate"; exit 1; fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Repack, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          node fork/repack-macos.mjs
          --zip "$RUNNER_TEMP/upstream/T3-Code-$VERSION-${{ matrix.arch }}.zip"
          --arch "${{ matrix.arch }}"
          --tag "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --server-dist "$RUNNER_TEMP/server-dist"
          --desktop-dist "$RUNNER_TEMP/desktop-dist"
          --identity "${{ steps.cert.outputs.identity }}"
          --keychain "${{ steps.cert.outputs.keychain }}"
          --out "$RUNNER_TEMP/out"
          --work "$RUNNER_TEMP/work"

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/T3-Code-${{ env.VERSION }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    needs: [pick, build, cli, windows, macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.cli.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.pick.outputs.tag }}
      VERSION: ${{ needs.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Write CLI archive checksums
        run: |
          cd release
          sha256sum t3-*.tar.gz t3-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Write the macOS update feed
        run: node fork/mac-update-feed.mjs --version "$VERSION" --dir release

      - name: Publish
        run: |
          ls -la release
          if [ "${{ needs.pick.outputs.replace }}" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release view "$TAG" --repo "$UPSTREAM" --json name --jq .name > title.txt
          gh release view "$TAG" --repo "$UPSTREAM" --json body --jq .body > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "${{ needs.build.outputs.sha }}" --latest \
            --title "$(cat title.txt)" --notes-file notes.md release/*
