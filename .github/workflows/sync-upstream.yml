name: Sync upstream source

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UPSTREAM: pingdotgg/t3code
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash fork/sync.sh merge

      - name: Setup dependencies
        if: steps.merge.outputs.merged == 'true'
        uses: ./.github/actions/setup-ci-deps

      - name: Verify fork changes and telemetry
        if: steps.merge.outputs.merged == 'true'
        run: bash fork/sync.sh verify

      - name: Push
        if: steps.merge.outputs.merged == 'true'
        run: |
          if ! git push origin HEAD:main; then
            echo "::error::Push refused. Upstream commits that touch workflows need a FORK_SYNC_TOKEN secret: a fine-grained token for this repository with Contents and Workflows read/write."
            exit 1
          fi
          git log --oneline -1

      - name: Keep releases coming
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash fork/ensure-release.sh
