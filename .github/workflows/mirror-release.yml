name: Mirror upstream release

on:
  schedule:
    - cron: "41 * * * *"
  push:
    branches: [main]
    paths: [fork/**, .github/workflows/mirror-release.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to rebuild (default latest stable)
        required: false
      replace:
        description: Replace the release if this tag is already mirrored
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: mirror-release
  cancel-in-progress: false

env:
  UPSTREAM: pingdotgg/t3code

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      skip: ${{ steps.pick.outputs.skip }}
      replace: ${{ steps.pick.outputs.replace }}
    steps:
      - name: Keep schedule alive
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/mirror-release.yml/enable" || true

      - name: Pick release
        id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REPLACE: ${{ inputs.replace }}
        run: |
          tag="${INPUT_TAG:-$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$REPLACE" = "true" ]; then
              echo "replace=true" >> "$GITHUB_OUTPUT"
            else
              echo "$tag is already mirrored."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: pick
    if: needs.pick.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.pick.outputs.tag }}
      VERSION: ${{ needs.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the release with fork changes
        id: apply
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cp -r fork "$RUNNER_TEMP/fork-tools"
          cp FORK.md "$RUNNER_TEMP/fork-tools/"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" \
            +refs/heads/main:refs/remotes/upstream/main "+refs/tags/$TAG:refs/tags/$TAG"
          excludes=(
            ':(exclude).github'
            ':(exclude)fork'
            ':(exclude)FORK.md'
            ':(exclude)**/*.test.ts'
            ':(exclude)**/*.test.tsx'
          )
          ref="$(git rev-parse HEAD)"
          while :; do
            base="$(git merge-base "$ref" upstream/main)"
            git diff --binary "$base" "$ref" -- . "${excludes[@]}" > "$RUNNER_TEMP/fork.patch"
            git checkout -q --detach --force "$TAG"
            git clean -fdq
            if [ ! -s "$RUNNER_TEMP/fork.patch" ] || git apply --3way "$RUNNER_TEMP/fork.patch"; then
              echo "Applied fork changes from $(git rev-parse --short "$ref") (base $(git rev-parse --short "$base")) onto $TAG"
              git diff --stat "$base" "$ref" -- . "${excludes[@]}"
              break
            fi
            # Unwind post-$TAG upstream sync merges (and workflow/docs-only commits)
            # when main has synced past $TAG into conflicting upstream edits.
            if ! git rev-parse --verify -q "$ref^1" > /dev/null; then
              exit 1
            fi
            if git rev-parse --verify -q "$ref^2" > /dev/null \
              && git merge-base --is-ancestor "$ref^2" upstream/main \
              && ! git merge-base --is-ancestor "$ref^2" "$TAG" \
              && git log -1 --format=%s "$ref" | grep -Eq "^Merge $UPSTREAM main \([0-9a-f]+\)$"; then
              echo "Retrying without post-$TAG upstream sync $(git rev-parse --short "$ref")..."
              ref="$(git rev-parse "$ref^1")"
            elif ! git rev-parse --verify -q "$ref^2" > /dev/null \
              && git diff --quiet "$ref^1" "$ref" -- . "${excludes[@]}"; then
              ref="$(git rev-parse "$ref^1")"
            else
              if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                echo "::error::Fork changes at $(git rev-parse --short "$ref") do not apply onto $TAG"
                exit 1
              fi
              tools="$RUNNER_TEMP/fork-tools"
              FORK_SIDE=theirs bash "$tools/resolve-fork-owned.sh"
              bash "$tools/resolve-additive-conflicts.sh"
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ -n "$conflicts" ]; then
                {
                  echo "Resolve the conflicts left by \`git apply --3way\` of the fork's changes onto upstream release $TAG. Ours is the release, theirs is the fork. Nothing is committed here."
                  echo
                  echo "$conflicts" | sed 's/^/- /'
                } > "$RUNNER_TEMP/task"
                bash "$tools/claude.sh" "$RUNNER_TEMP/task"
                left="$(git diff --name-only --diff-filter=U)"
                marked="$(echo "$conflicts" | while read -r f; do [ -f "$f" ] && grep -lE '^(<{7}|>{7})( |$)' -- "$f"; done || true)"
                if [ -n "$left$marked" ]; then
                  echo "::error::Fork changes at $(git rev-parse --short "$ref") still conflict with $TAG in: $(echo $left $marked)"
                  exit 1
                fi
                echo "claude=true" >> "$GITHUB_OUTPUT"
                {
                  echo "### Claude resolved the fork changes onto $TAG"
                  echo
                  echo "$conflicts" | sed 's/^/- `/; s/$/`/'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "Applied fork changes from $(git rev-parse --short "$ref") onto $TAG with conflicts resolved"
              break
            fi
          done

      - name: Read upstream build config
        run: |
          gh release download "$TAG" --repo "$UPSTREAM" --pattern "T3-Code-$VERSION-arm64.zip" --dir "$RUNNER_TEMP/upstream"
          zip="$RUNNER_TEMP/upstream/T3-Code-$VERSION-arm64.zip"
          entry="$(unzip -Z1 "$zip" | grep -m1 'Contents/Resources/app\.asar$')"
          unzip -p "$zip" "$entry" > "$RUNNER_TEMP/app.asar"
          node "$RUNNER_TEMP/fork-tools/upstream-client-env.mjs" --asar "$RUNNER_TEMP/app.asar" --work "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Typecheck Claude's resolution
        if: steps.apply.outputs.claude == 'true'
        run: |
          (cd apps/server && vp run typecheck)
          (cd apps/web && vp run typecheck)

      - name: Build server and web client
        run: vp run --filter t3 build

      - name: Refuse to ship telemetry
        run: node "$RUNNER_TEMP/fork-tools/telemetry-guard.mjs" --dist apps/server/dist

      - name: Build desktop main process
        working-directory: apps/desktop
        run: |
          node scripts/build-preview-annotation-css.mjs
          T3CODE_CLERK_PUBLISHABLE_KEY="$VITE_CLERK_PUBLISHABLE_KEY" vp pack

      - uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: |
            apps/server/dist
            !apps/server/dist/**/*.map
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: |
            apps/desktop/dist-electron
            !apps/desktop/dist-electron/**/*.map
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: [pick, build]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      SEVEN_ZIP: C:/Program Files/7-Zip/7z.exe
      TAG: ${{ needs.pick.outputs.tag }}
      VERSION: ${{ needs.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ${{ runner.temp }}/server-dist

      - uses: actions/download-artifact@v4
        with:
          name: desktop-dist
          path: ${{ runner.temp }}/desktop-dist

      - name: Download upstream installer
        run: >
          gh release download "$TAG" --repo "$UPSTREAM"
          --pattern "T3-Code-$VERSION-x64.exe" --dir "$RUNNER_TEMP/upstream"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repack
        run: >
          node fork/repack-windows.mjs
          --installer "$RUNNER_TEMP/upstream/T3-Code-$VERSION-x64.exe"
          --tag "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --server-dist "$RUNNER_TEMP/server-dist"
          --desktop-dist "$RUNNER_TEMP/desktop-dist"
          --out "$RUNNER_TEMP/out"
          --work "$RUNNER_TEMP/work"
          --7z "$SEVEN_ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            ${{ runner.temp }}/out/T3-Code-${{ env.VERSION }}-x64.exe
            ${{ runner.temp }}/out/T3-Code-${{ env.VERSION }}-x64.exe.blockmap
            ${{ runner.temp }}/out/latest.yml
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: [pick, build]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.pick.outputs.tag }}
      VERSION: ${{ needs.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ${{ runner.temp }}/server-dist

      - uses: actions/download-artifact@v4
        with:
          name: desktop-dist
          path: ${{ runner.temp }}/desktop-dist

      - name: Download upstream app
        run: >
          gh release download "$TAG" --repo "$UPSTREAM"
          --pattern "T3-Code-$VERSION-${{ matrix.arch }}.zip" --dir "$RUNNER_TEMP/upstream"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import signing certificate
        id: cert
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -sSLf -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then echo "::error::No Developer ID Application identity in the certificate"; exit 1; fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Repack, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          node fork/repack-macos.mjs
          --zip "$RUNNER_TEMP/upstream/T3-Code-$VERSION-${{ matrix.arch }}.zip"
          --arch "${{ matrix.arch }}"
          --tag "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --server-dist "$RUNNER_TEMP/server-dist"
          --desktop-dist "$RUNNER_TEMP/desktop-dist"
          --identity "${{ steps.cert.outputs.identity }}"
          --keychain "${{ steps.cert.outputs.keychain }}"
          --out "$RUNNER_TEMP/out"
          --work "$RUNNER_TEMP/work"

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/T3-Code-${{ env.VERSION }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    needs: [pick, windows, macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.pick.outputs.tag }}
      VERSION: ${{ needs.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Write the macOS update feed
        run: node fork/mac-update-feed.mjs --version "$VERSION" --dir release

      - name: Publish
        run: |
          ls -la release
          if [ "${{ needs.pick.outputs.replace }}" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release view "$TAG" --repo "$UPSTREAM" --json name --jq .name > title.txt
          gh release view "$TAG" --repo "$UPSTREAM" --json body --jq .body > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "$(cat title.txt)" --notes-file notes.md release/*
